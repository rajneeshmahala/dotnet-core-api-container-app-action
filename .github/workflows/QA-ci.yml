# ============================================================
#  QA Build Docker CI
#  + Microsoft Teams Notifications (Incoming Webhook)
#
#  SETUP — Add this secret to your repository:
#    Name : TEAMS_WEBHOOK_URL
#    Value: your Teams Incoming Webhook URL
#
#  NOTIFICATIONS SENT:
#    🚀 Pipeline Started
#    ✅ RC Branch Created
#    ❌ Build Failed
#    ❌ Docker Image Scan Failed
#    ❌ Merge Conflict Detected
#    🔀 PR Auto-Created
#    🔄 PR Updated (existing PR)
#    ✅ Pipeline Success Summary
#    ❌ Pipeline Failed (catch-all)
#
#  BUG FIXED: image-ref was using ${{ env.BUILD_ID }} (always empty
#             inside with: blocks) — fixed to ${{ github.run_number }}
# ============================================================

name: QA Build Docker CI

on:
  push:
    branches:
      - 'QA/*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ── 1. Checkout ─────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── 2. Extract Branch Info ───────────────────────────────
      - name: Extract branch info
        id: vars
        run: |
          SOURCE_BRANCH="${GITHUB_REF#refs/heads/}"
          echo "Processing: $SOURCE_BRANCH"

          APP=$(echo "$SOURCE_BRANCH" | cut -d'/' -f2 | cut -d'-' -f1)
          TARGET_BRANCH="RC/${APP}"

          echo "source=$SOURCE_BRANCH"  >> $GITHUB_OUTPUT
          echo "target=$TARGET_BRANCH"  >> $GITHUB_OUTPUT
          echo "app=$APP"               >> $GITHUB_OUTPUT

          echo "✅ APP=$APP | TARGET=$TARGET_BRANCH"

      # ── 🔔 NOTIFY: Pipeline Started ─────────────────────────
      - name: "Notify Teams — Pipeline Started"
        run: |
          curl -s -X POST "${{ secrets.TEAMS_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{
              "@type": "MessageCard",
              "@context": "http://schema.org/extensions",
              "themeColor": "0078D4",
              "summary": "QA Build Docker CI Started",
              "sections": [{
                "activityTitle": "🚀 QA Build Docker CI Started",
                "activitySubtitle": "Build, Docker, security scan and RC PR automation",
                "facts": [
                  { "name": "Source Branch", "value": "'"${{ steps.vars.outputs.source }}"'" },
                  { "name": "Target Branch", "value": "'"${{ steps.vars.outputs.target }}"'" },
                  { "name": "App",           "value": "'"${{ steps.vars.outputs.app }}"'" },
                  { "name": "Triggered by",  "value": "'"${{ github.actor }}"'" },
                  { "name": "Run",           "value": "#'"${{ github.run_number }}"'" }
                ]
              }],
              "potentialAction": [{
                "@type": "OpenUri",
                "name": "View Run",
                "targets": [{ "os": "default", "uri": "'"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"'" }]
              }]
            }'

      # ── 3. Configure Git ─────────────────────────────────────
      - name: Configure Git
        run: |
          git config user.name  "github-actions"
          git config user.email "github-actions@github.com"

      # ── 4. Check if RC Branch Exists ────────────────────────
      - name: Check if RC branch exists
        id: check
        run: |
          git fetch origin
          if git ls-remote --exit-code --heads origin "${{ steps.vars.outputs.target }}"; then
            echo "exists=true"  >> $GITHUB_OUTPUT
            echo "✅ RC branch exists"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "🚀 RC branch will be created"
          fi

      # ── 5. Create RC Branch (only if missing) ───────────────
      - name: Create RC branch
        if: steps.check.outputs.exists == 'false'
        run: |
          TARGET="${{ steps.vars.outputs.target }}"
          git checkout origin/${{ github.event.repository.default_branch }} -b "$TARGET"
          git push origin "$TARGET"
          echo "✅ Created: $TARGET"

      # ── 🔔 NOTIFY: RC Branch Created ────────────────────────
      - name: "Notify Teams — RC Branch Created"
        if: steps.check.outputs.exists == 'false'
        run: |
          curl -s -X POST "${{ secrets.TEAMS_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{
              "@type": "MessageCard",
              "@context": "http://schema.org/extensions",
              "themeColor": "107C10",
              "summary": "RC Branch Created",
              "sections": [{
                "activityTitle": "✅ RC Branch Created from default branch",
                "facts": [
                  { "name": "RC Branch",     "value": "'"${{ steps.vars.outputs.target }}"'" },
                  { "name": "Source Branch", "value": "'"${{ steps.vars.outputs.source }}"'" },
                  { "name": "App",           "value": "'"${{ steps.vars.outputs.app }}"'" },
                  { "name": "Created by",    "value": "'"${{ github.actor }}"'" },
                  { "name": "Note",          "value": "Push again to trigger a PR into the RC branch" }
                ]
              }],
              "potentialAction": [{
                "@type": "OpenUri",
                "name": "View Run",
                "targets": [{ "os": "default", "uri": "'"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"'" }]
              }]
            }'

      # ── 6. Setup .NET + Restore ─────────────────────────────
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore DemoApp.sln

      # ── 7. Build ─────────────────────────────────────────────
      - name: Build
        id: build
        run: dotnet build DemoApp.sln --no-restore

      - name: "Notify Teams — Build Failed"
        if: failure() && steps.build.outcome == 'failure'
        run: |
          curl -s -X POST "${{ secrets.TEAMS_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{
              "@type": "MessageCard",
              "@context": "http://schema.org/extensions",
              "themeColor": "D13438",
              "summary": "Build Failed",
              "sections": [{
                "activityTitle": "❌ Build Failed — Pipeline Blocked",
                "facts": [
                  { "name": "Branch", "value": "'"${{ github.ref_name }}"'" },
                  { "name": "App",    "value": "'"${{ steps.vars.outputs.app }}"'" },
                  { "name": "Run",    "value": "#'"${{ github.run_number }}"'" },
                  { "name": "Action", "value": "Fix build errors and repush to QA branch" }
                ]
              }],
              "potentialAction": [{
                "@type": "OpenUri",
                "name": "View Failed Run",
                "targets": [{ "os": "default", "uri": "'"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"'" }]
              }]
            }'

      # ── 8. Lint ──────────────────────────────────────────────
      - name: Lint (format check)
        run: dotnet format DemoApp.sln --verify-no-changes || echo "⚠️ Lint issues found"

      # ── 9. Publish ───────────────────────────────────────────
      - name: Publish
        run: dotnet publish DemoApp/DemoApp.csproj -c Release -o out

      # ── 10. Docker Build ─────────────────────────────────────
      - name: Build Docker
        run: |
          docker build -t demo-dotnet:${{ github.run_number }} .
          docker tag demo-dotnet:${{ github.run_number }} demo-dotnet:latest

      # ── 11. Trivy Image Scan ─────────────────────────────────
      #  ✅ FIXED: was ${{ env.BUILD_ID }} (always empty in with: blocks)
      #            now uses ${{ github.run_number }} directly
      - name: Run Trivy Image Scan
        id: trivy_image
        uses: aquasecurity/trivy-action@v0.20.0
        with:
          image-ref:      demo-dotnet:${{ github.run_number }}
          exit-code:      1
          severity:       CRITICAL
          ignore-unfixed: true

      - name: "Notify Teams — Docker Image Scan Failed"
        if: failure() && steps.trivy_image.outcome == 'failure'
        run: |
          curl -s -X POST "${{ secrets.TEAMS_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{
              "@type": "MessageCard",
              "@context": "http://schema.org/extensions",
              "themeColor": "D13438",
              "summary": "Docker Image Scan Failed",
              "sections": [{
                "activityTitle": "❌ Docker Image Scan Failed — Pipeline Blocked",
                "activitySubtitle": "Trivy found fixable CRITICAL CVEs in the Docker image",
                "facts": [
                  { "name": "Image",   "value": "demo-dotnet:'"${{ github.run_number }}"'" },
                  { "name": "Branch",  "value": "'"${{ github.ref_name }}"'" },
                  { "name": "App",     "value": "'"${{ steps.vars.outputs.app }}"'" },
                  { "name": "Run",     "value": "#'"${{ github.run_number }}"'" },
                  { "name": "Action",  "value": "Update base image or vulnerable packages and repush" }
                ]
              }],
              "potentialAction": [{
                "@type": "OpenUri",
                "name": "View Failed Run",
                "targets": [{ "os": "default", "uri": "'"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"'" }]
              }]
            }'

      # ── 12. Fetch RC Branch ──────────────────────────────────
      - name: Fetch target branch
        run: git fetch origin "${{ steps.vars.outputs.target }}"

      # ── 13. Merge Conflict Check ─────────────────────────────
      - name: Check merge conflict
        run: |
          SOURCE="${{ steps.vars.outputs.source }}"
          TARGET="${{ steps.vars.outputs.target }}"

          git checkout "$SOURCE"
          git merge "origin/$TARGET" --no-commit --no-ff \
            || echo "MERGE_FAILED=true" >> $GITHUB_ENV

          git merge --abort || true

          if [ "$MERGE_FAILED" = "true" ]; then

            curl -s -X POST "${{ secrets.TEAMS_WEBHOOK_URL }}" \
              -H "Content-Type: application/json" \
              -d '{
                "@type": "MessageCard",
                "@context": "http://schema.org/extensions",
                "themeColor": "D13438",
                "summary": "Merge Conflict Detected",
                "sections": [{
                  "activityTitle": "❌ Merge Conflict Detected — PR Blocked",
                  "activitySubtitle": "Manual resolution required before PR can be raised to RC",
                  "facts": [
                    { "name": "QA Branch", "value": "'"$SOURCE"'" },
                    { "name": "RC Branch", "value": "'"$TARGET"'" },
                    { "name": "App",       "value": "'"${{ steps.vars.outputs.app }}"'" },
                    { "name": "Fix",       "value": "git fetch origin && git merge origin/'"$TARGET"' — resolve conflicts — git push" }
                  ]
                }],
                "potentialAction": [{
                  "@type": "OpenUri",
                  "name": "View Run",
                  "targets": [{ "os": "default", "uri": "'"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"'" }]
                }]
              }'

            echo "❌ Merge conflict detected with $TARGET"
            exit 1
          fi
          echo "✅ No conflicts"

      # ── 14. Create Pull Request ──────────────────────────────
      - name: Create Pull Request
        id: pr
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          SOURCE="${{ steps.vars.outputs.source }}"
          TARGET="${{ steps.vars.outputs.target }}"

          EXISTING=$(gh pr list \
            --base "$TARGET" --head "$SOURCE" \
            --state open --json number,url --jq '.[0]')

          EXISTING_NUM=$(echo "$EXISTING" | jq -r '.number // empty')
          EXISTING_URL=$(echo "$EXISTING" | jq -r '.url // empty')

          if [ -z "$EXISTING_NUM" ]; then
            gh pr create \
              --base  "$TARGET" \
              --head  "$SOURCE" \
              --title "Auto PR: $SOURCE → $TARGET" \
              --body  "$(printf '🚀 Auto-created PR\n\n**App:** ${{ steps.vars.outputs.app }}')"

            PR_URL=$(gh pr list \
              --base "$TARGET" --head "$SOURCE" \
              --state open --json url --jq '.[0].url')

            echo "pr_status=created" >> $GITHUB_OUTPUT
            echo "pr_url=${PR_URL}"  >> $GITHUB_OUTPUT
            echo "✅ PR created: $PR_URL"
          else
            echo "pr_status=existing"     >> $GITHUB_OUTPUT
            echo "pr_url=${EXISTING_URL}" >> $GITHUB_OUTPUT
            echo "✅ PR #$EXISTING_NUM already exists. Skipping."
          fi

      # ── 🔔 NOTIFY: PR Auto-Created ───────────────────────────
      - name: "Notify Teams — PR Auto-Created"
        if: success() && steps.pr.outputs.pr_status == 'created'
        run: |
          curl -s -X POST "${{ secrets.TEAMS_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{
              "@type": "MessageCard",
              "@context": "http://schema.org/extensions",
              "themeColor": "107C10",
              "summary": "RC PR Auto-Created",
              "sections": [{
                "activityTitle": "🔀 RC Pull Request Auto-Created",
                "activitySubtitle": "'"${{ steps.vars.outputs.source }}"' → '"${{ steps.vars.outputs.target }}"'",
                "facts": [
                  { "name": "PR URL",        "value": "'"${{ steps.pr.outputs.pr_url }}"'" },
                  { "name": "App",           "value": "'"${{ steps.vars.outputs.app }}"'" },
                  { "name": "Created by",    "value": "'"${{ github.actor }}"'" },
                  { "name": "Run",           "value": "#'"${{ github.run_number }}"'" },
                  { "name": "Action needed", "value": "Review and approve the RC PR" }
                ]
              }],
              "potentialAction": [{
                "@type": "OpenUri",
                "name": "Review PR",
                "targets": [{ "os": "default", "uri": "'"${{ steps.pr.outputs.pr_url }}"'" }]
              }]
            }'

      # ── 🔔 NOTIFY: PR Already Exists (Updated) ───────────────
      - name: "Notify Teams — PR Updated"
        if: success() && steps.pr.outputs.pr_status == 'existing'
        run: |
          curl -s -X POST "${{ secrets.TEAMS_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{
              "@type": "MessageCard",
              "@context": "http://schema.org/extensions",
              "themeColor": "0078D4",
              "summary": "RC PR Updated by New Push",
              "sections": [{
                "activityTitle": "🔄 Existing RC PR Updated by New Push",
                "activitySubtitle": "'"${{ steps.vars.outputs.source }}"' → '"${{ steps.vars.outputs.target }}"'",
                "facts": [
                  { "name": "PR URL",   "value": "'"${{ steps.pr.outputs.pr_url }}"'" },
                  { "name": "App",      "value": "'"${{ steps.vars.outputs.app }}"'" },
                  { "name": "Pushed by","value": "'"${{ github.actor }}"'" },
                  { "name": "Run",      "value": "#'"${{ github.run_number }}"'" }
                ]
              }],
              "potentialAction": [{
                "@type": "OpenUri",
                "name": "View PR",
                "targets": [{ "os": "default", "uri": "'"${{ steps.pr.outputs.pr_url }}"'" }]
              }]
            }'

      # ── 🔔 NOTIFY: Pipeline Success ──────────────────────────
      - name: "Notify Teams — Pipeline Success"
        if: success()
        run: |
          if [ "${{ steps.check.outputs.exists }}" == "false" ]; then
            RESULT="New RC branch created. Push again to trigger PR."
          else
            RESULT="Build, Docker scan passed. PR created or already open."
          fi

          curl -s -X POST "${{ secrets.TEAMS_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{
              "@type": "MessageCard",
              "@context": "http://schema.org/extensions",
              "themeColor": "107C10",
              "summary": "QA Build Docker CI Passed",
              "sections": [{
                "activityTitle": "✅ QA Build Docker CI Completed Successfully",
                "facts": [
                  { "name": "QA Branch",  "value": "'"${{ steps.vars.outputs.source }}"'" },
                  { "name": "RC Branch",  "value": "'"${{ steps.vars.outputs.target }}"'" },
                  { "name": "App",        "value": "'"${{ steps.vars.outputs.app }}"'" },
                  { "name": "Image",      "value": "demo-dotnet:'"${{ github.run_number }}"'" },
                  { "name": "Run",        "value": "#'"${{ github.run_number }}"'" },
                  { "name": "Result",     "value": "'"$RESULT"'" }
                ]
              }],
              "potentialAction": [{
                "@type": "OpenUri",
                "name": "View Run",
                "targets": [{ "os": "default", "uri": "'"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"'" }]
              }]
            }'

      # ── 🔔 NOTIFY: Pipeline Failed (catch-all) ───────────────
      - name: "Notify Teams — Pipeline Failed"
        if: failure()
        run: |
          curl -s -X POST "${{ secrets.TEAMS_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{
              "@type": "MessageCard",
              "@context": "http://schema.org/extensions",
              "themeColor": "D13438",
              "summary": "QA Build Docker CI Failed",
              "sections": [{
                "activityTitle": "❌ QA Build Docker CI Failed",
                "facts": [
                  { "name": "Branch",      "value": "'"${{ github.ref_name }}"'" },
                  { "name": "App",         "value": "'"${{ steps.vars.outputs.app }}"'" },
                  { "name": "Triggered by","value": "'"${{ github.actor }}"'" },
                  { "name": "Run",         "value": "#'"${{ github.run_number }}"'" }
                ]
              }],
              "potentialAction": [{
                "@type": "OpenUri",
                "name": "View Failed Run",
                "targets": [{ "os": "default", "uri": "'"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"'" }]
              }]
            }'

      # ── 15. Summary ───────────────────────────────────────────
      - name: Summary
        if: always()
        run: |
          echo "================================================"
          if [ "${{ steps.check.outputs.exists }}" == "false" ]; then
            echo "  ✔ RC branch created. No PR needed."
          else
            echo "  ✔ RC branch existed. PR handled."
          fi
          echo "  Source : ${{ steps.vars.outputs.source }}"
          echo "  Target : ${{ steps.vars.outputs.target }}"
          echo "  Image  : demo-dotnet:${{ github.run_number }}"
          echo "  Run    : #${{ github.run_number }}"
          echo "================================================"