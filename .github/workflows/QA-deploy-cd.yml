# ============================================================
#  QA Deploy to Azure Container App
#  + Microsoft Teams Notifications (Incoming Webhook)
#
#  Triggered automatically after QA Build Docker CI completes
#
#  NOTIFICATIONS SENT:
#    ⏭️  Deploy Skipped (QA Build failed)
#    🚀  Deployment Started
#    ✅  Deployment Succeeded
#    ❌  Deployment Failed
# ============================================================

name: QA Deploy to Azure Container App

on:
  workflow_run:
    workflows: ["QA build Docker CI"]
    types:
      - completed

jobs:

  # ── Notify if upstream build failed — deploy skipped ──────
  notify-skipped:
    if: github.event.workflow_run.conclusion != 'success'
    runs-on: ubuntu-latest
    steps:
      - name: "Notify Teams — Deploy Skipped"
        run: |
          curl -s -X POST "${{ secrets.TEAMS_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{
              "@type": "MessageCard",
              "@context": "http://schema.org/extensions",
              "themeColor": "FFA500",
              "summary": "QA Deployment Skipped",
              "sections": [{
                "activityTitle": "⏭️ QA Deployment Skipped — Build Did Not Pass",
                "activitySubtitle": "QA Deploy to Azure Container App was not triggered",
                "facts": [
                  { "name": "Upstream Workflow", "value": "'"${{ github.event.workflow_run.name }}"'" },
                  { "name": "Branch",            "value": "'"${{ github.event.workflow_run.head_branch }}"'" },
                  { "name": "Build Conclusion",  "value": "'"${{ github.event.workflow_run.conclusion }}"'" },
                  { "name": "Build Run",         "value": "#'"${{ github.event.workflow_run.run_number }}"'" },
                  { "name": "Reason",            "value": "Fix the failing QA Build Docker CI run first, then repush" }
                ]
              }],
              "potentialAction": [{
                "@type": "OpenUri",
                "name": "View Build Run",
                "targets": [{ "os": "default", "uri": "'"${{ github.event.workflow_run.html_url }}"'" }]
              }]
            }'

  # ── Main deploy job ────────────────────────────────────────
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:

      # ── 1. Debug Info ──────────────────────────────────────
      - name: Debug Info
        run: |
          echo "Workflow   : ${{ github.event.workflow_run.name }}"
          echo "Branch     : ${{ github.event.workflow_run.head_branch }}"
          echo "Conclusion : ${{ github.event.workflow_run.conclusion }}"
          echo "Build Run  : #${{ github.event.workflow_run.run_number }}"

      # ── 🔔 NOTIFY: Deployment Started ──────────────────────
      - name: "Notify Teams — Deployment Started"
        run: |
          curl -s -X POST "${{ secrets.TEAMS_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{
              "@type": "MessageCard",
              "@context": "http://schema.org/extensions",
              "themeColor": "0078D4",
              "summary": "QA Deployment Started",
              "sections": [{
                "activityTitle": "🚀 QA Deployment Started — Azure Container App",
                "activitySubtitle": "QA Build Docker CI passed — deploying now",
                "facts": [
                  { "name": "Branch",       "value": "'"${{ github.event.workflow_run.head_branch }}"'" },
                  { "name": "Image Tag",    "value": "demo-dotnet:'"${{ github.event.workflow_run.run_number }}"'" },
                  { "name": "Build Run",    "value": "#'"${{ github.event.workflow_run.run_number }}"'" },
                  { "name": "Deploy Run",   "value": "#'"${{ github.run_number }}"'" },
                  { "name": "Triggered by", "value": "'"${{ github.actor }}"'" },
                  { "name": "Target",       "value": "Azure Container App (QA)" }
                ]
              }],
              "potentialAction": [{
                "@type": "OpenUri",
                "name": "View Deploy Run",
                "targets": [{ "os": "default", "uri": "'"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"'" }]
              }]
            }'

      # ── 2. Deployment Step ─────────────────────────────────
      - name: Deployment Step
        id: deploy
        run: |
          echo "🚀 Deploying application..."
          echo "Branch   : ${{ github.event.workflow_run.head_branch }}"
          echo "Build ID : ${{ github.event.workflow_run.run_number }}"
          echo "✅ Deployed Docker container on Azure Container App (QA)"
          # ── Uncomment to enable real Azure deployment ──────
          # az login --service-principal \
          #   -u ${{ secrets.AZURE_CLIENT_ID }} \
          #   -p ${{ secrets.AZURE_CLIENT_SECRET }} \
          #   --tenant ${{ secrets.AZURE_TENANT_ID }}
          # az containerapp update \
          #   --name <your-qa-container-app> \
          #   --resource-group <your-rg> \
          #   --image ${{ secrets.ACR_LOGIN_SERVER }}/demo-dotnet:${{ github.event.workflow_run.run_number }}

      # ── 🔔 NOTIFY: Deployment Succeeded ────────────────────
      - name: "Notify Teams — Deployment Succeeded"
        if: success()
        run: |
          curl -s -X POST "${{ secrets.TEAMS_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{
              "@type": "MessageCard",
              "@context": "http://schema.org/extensions",
              "themeColor": "107C10",
              "summary": "QA Deployment Succeeded",
              "sections": [{
                "activityTitle": "✅ QA Deployment Succeeded — Azure Container App",
                "activitySubtitle": "Application is live on QA environment",
                "facts": [
                  { "name": "Branch",      "value": "'"${{ github.event.workflow_run.head_branch }}"'" },
                  { "name": "Image Tag",   "value": "demo-dotnet:'"${{ github.event.workflow_run.run_number }}"'" },
                  { "name": "Build Run",   "value": "#'"${{ github.event.workflow_run.run_number }}"'" },
                  { "name": "Deploy Run",  "value": "#'"${{ github.run_number }}"'" },
                  { "name": "Environment", "value": "QA — Azure Container App" }
                ]
              }],
              "potentialAction": [
                {
                  "@type": "OpenUri",
                  "name": "View Deploy Run",
                  "targets": [{ "os": "default", "uri": "'"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"'" }]
                },
                {
                  "@type": "OpenUri",
                  "name": "View Build Run",
                  "targets": [{ "os": "default", "uri": "'"${{ github.event.workflow_run.html_url }}"'" }]
                }
              ]
            }'

      # ── 🔔 NOTIFY: Deployment Failed ───────────────────────
      - name: "Notify Teams — Deployment Failed"
        if: failure()
        run: |
          curl -s -X POST "${{ secrets.TEAMS_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{
              "@type": "MessageCard",
              "@context": "http://schema.org/extensions",
              "themeColor": "D13438",
              "summary": "QA Deployment Failed",
              "sections": [{
                "activityTitle": "❌ QA Deployment Failed — Azure Container App",
                "activitySubtitle": "QA Build passed but deployment step failed",
                "facts": [
                  { "name": "Branch",      "value": "'"${{ github.event.workflow_run.head_branch }}"'" },
                  { "name": "Image Tag",   "value": "demo-dotnet:'"${{ github.event.workflow_run.run_number }}"'" },
                  { "name": "Build Run",   "value": "#'"${{ github.event.workflow_run.run_number }}"'" },
                  { "name": "Deploy Run",  "value": "#'"${{ github.run_number }}"'" },
                  { "name": "Environment", "value": "QA — Azure Container App" },
                  { "name": "Action",      "value": "Check Azure credentials, ACR access and container app config" }
                ]
              }],
              "potentialAction": [{
                "@type": "OpenUri",
                "name": "View Failed Deploy Run",
                "targets": [{ "os": "default", "uri": "'"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"'" }]
              }]
            }'