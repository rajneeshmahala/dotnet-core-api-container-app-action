# ============================================================
#  WIP Build CI
#  + Microsoft Teams Notifications (Incoming Webhook)
#
#  SETUP — Add this secret to your repository:
#    Name : TEAMS_WEBHOOK_URL
#    Value: your Teams Incoming Webhook URL
#
#  NOTIFICATIONS SENT:
#    🚀 Pipeline Started
#    ❌ Invalid Branch Name
#    ✅ Consolidate Branch Created
#    ❌ Credential Scan Failed (Gitleaks)
#    ❌ Build Failed
#    ❌ Unit Tests Failed
#    ❌ Docker Image Scan Failed
#    ❌ Merge Conflict Detected
#    🔀 PR Auto-Created / Updated
#    ✅ Pipeline Success Summary
#    ❌ Pipeline Failed (catch-all)
#
#  BUG FIXED: image-ref was using ${{ env.BUILD_ID }} (empty in with: blocks)
#             Fixed to use ${{ github.run_number }} directly
# ============================================================

name: WIP Build CI

on:
  push:
    branches:
      - wip/*

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ── 1. Checkout ─────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name  "github-actions"
          git config user.email "github-actions@github.com"

      # ── 🔔 NOTIFY: Pipeline Started ─────────────────────────
      - name: "Notify Teams — Pipeline Started"
        run: |
          curl -s -X POST "${{ secrets.TEAMS_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{
              "@type": "MessageCard",
              "@context": "http://schema.org/extensions",
              "themeColor": "0078D4",
              "summary": "WIP Build CI Started",
              "sections": [{
                "activityTitle": "🚀 WIP Build CI Started",
                "activitySubtitle": "Build, test, Docker, security scan and PR automation",
                "facts": [
                  { "name": "Branch",      "value": "'"${{ github.ref_name }}"'" },
                  { "name": "Triggered by","value": "'"${{ github.actor }}"'" },
                  { "name": "Run",         "value": "#'"${{ github.run_number }}"'" },
                  { "name": "Repository",  "value": "'"${{ github.repository }}"'" }
                ]
              }],
              "potentialAction": [{
                "@type": "OpenUri",
                "name": "View Run",
                "targets": [{ "os": "default", "uri": "'"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"'" }]
              }]
            }'

      # ── 2. Extract & Validate Branch Info ───────────────────
      - name: Extract branch info
        id: vars
        run: |
          SOURCE_BRANCH="${GITHUB_REF#refs/heads/}"
          echo "Processing: $SOURCE_BRANCH"

          if [[ ! "$SOURCE_BRANCH" =~ ^wip\/[a-zA-Z0-9]+-[0-9]+-team[0-9]+$ ]]; then

            curl -s -X POST "${{ secrets.TEAMS_WEBHOOK_URL }}" \
              -H "Content-Type: application/json" \
              -d '{
                "@type": "MessageCard",
                "@context": "http://schema.org/extensions",
                "themeColor": "D13438",
                "summary": "Invalid Branch Name",
                "sections": [{
                  "activityTitle": "❌ Invalid Branch Name — Pipeline Stopped",
                  "activitySubtitle": "Branch does not match required naming convention",
                  "facts": [
                    { "name": "Branch",   "value": "'"$SOURCE_BRANCH"'" },
                    { "name": "Expected", "value": "wip/<app>-<sprint>-team<no>" },
                    { "name": "Example",  "value": "wip/api-8746-team1" },
                    { "name": "Run",      "value": "#'"${{ github.run_number }}"'" }
                  ]
                }],
                "potentialAction": [{
                  "@type": "OpenUri",
                  "name": "View Run",
                  "targets": [{ "os": "default", "uri": "'"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"'" }]
                }]
              }'

            echo "Invalid branch format. Expected: wip/<app>-<sprint>-team<no>"
            exit 1
          fi

          APP=$(echo "$SOURCE_BRANCH"    | cut -d'/' -f2 | cut -d'-' -f1)
          SPRINT=$(echo "$SOURCE_BRANCH" | cut -d'-' -f2)
          TEAM=$(echo "$SOURCE_BRANCH"   | cut -d'-' -f3)
          TARGET_BRANCH="consolidate/${APP}-${TEAM}-${SPRINT}"

          echo "source=$SOURCE_BRANCH"  >> $GITHUB_OUTPUT
          echo "target=$TARGET_BRANCH"  >> $GITHUB_OUTPUT
          echo "app=$APP"               >> $GITHUB_OUTPUT
          echo "sprint=$SPRINT"         >> $GITHUB_OUTPUT
          echo "team=$TEAM"             >> $GITHUB_OUTPUT
          echo "✅ APP=$APP | SPRINT=$SPRINT | TEAM=$TEAM | TARGET=$TARGET_BRANCH"

      # ── 3. Check if Consolidate Branch Exists ───────────────
      - name: Check if consolidate branch exists
        id: check
        run: |
          git fetch origin
          if git ls-remote --exit-code --heads origin "${{ steps.vars.outputs.target }}"; then
            echo "exists=true"  >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      # ── 4a. Create Consolidate Branch (only if missing) ─────
      - name: Create consolidate branch
        if: steps.check.outputs.exists == 'false'
        run: |
          TARGET="${{ steps.vars.outputs.target }}"
          git checkout origin/main -b "$TARGET"
          git push origin "$TARGET"
          echo "✅ Created: $TARGET"

      # ── 🔔 NOTIFY: Consolidate Branch Created ───────────────
      - name: "Notify Teams — Consolidate Branch Created"
        if: steps.check.outputs.exists == 'false'
        run: |
          curl -s -X POST "${{ secrets.TEAMS_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{
              "@type": "MessageCard",
              "@context": "http://schema.org/extensions",
              "themeColor": "107C10",
              "summary": "Consolidate Branch Created",
              "sections": [{
                "activityTitle": "✅ Consolidate Branch Created from main",
                "facts": [
                  { "name": "Consolidate Branch", "value": "'"${{ steps.vars.outputs.target }}"'" },
                  { "name": "WIP Branch",         "value": "'"${{ steps.vars.outputs.source }}"'" },
                  { "name": "App",                "value": "'"${{ steps.vars.outputs.app }}"'" },
                  { "name": "Sprint",             "value": "'"${{ steps.vars.outputs.sprint }}"'" },
                  { "name": "Team",               "value": "'"${{ steps.vars.outputs.team }}"'" }
                ]
              }],
              "potentialAction": [{
                "@type": "OpenUri",
                "name": "View Run",
                "targets": [{ "os": "default", "uri": "'"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"'" }]
              }]
            }'

      # ── 4b. Fetch Consolidate Branch (only if exists) ───────
      - name: Fetch target branch
        if: steps.check.outputs.exists == 'true'
        run: git fetch origin "${{ steps.vars.outputs.target }}"

      # ── 5. Credential Scan (Gitleaks) ───────────────────────
      - name: Credential Scan
        id: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "Notify Teams — Credential Scan Failed"
        if: failure() && steps.gitleaks.outcome == 'failure'
        run: |
          curl -s -X POST "${{ secrets.TEAMS_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{
              "@type": "MessageCard",
              "@context": "http://schema.org/extensions",
              "themeColor": "D13438",
              "summary": "Credential Scan Failed",
              "sections": [{
                "activityTitle": "❌ Credential Scan Failed — Pipeline Blocked",
                "activitySubtitle": "Gitleaks detected potential secrets or credentials in the code",
                "facts": [
                  { "name": "Branch",  "value": "'"${{ github.ref_name }}"'" },
                  { "name": "Run",     "value": "#'"${{ github.run_number }}"'" },
                  { "name": "Action",  "value": "Remove exposed secrets, rotate credentials, then repush" }
                ]
              }],
              "potentialAction": [{
                "@type": "OpenUri",
                "name": "View Failed Run",
                "targets": [{ "os": "default", "uri": "'"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"'" }]
              }]
            }'

      # ── 6. Setup .NET + Restore ─────────────────────────────
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore DemoApp.sln

      # ── 7. Build ─────────────────────────────────────────────
      - name: Build
        id: build
        run: dotnet build DemoApp.sln --no-restore

      - name: "Notify Teams — Build Failed"
        if: failure() && steps.build.outcome == 'failure'
        run: |
          curl -s -X POST "${{ secrets.TEAMS_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{
              "@type": "MessageCard",
              "@context": "http://schema.org/extensions",
              "themeColor": "D13438",
              "summary": "Build Failed",
              "sections": [{
                "activityTitle": "❌ Build Failed — Pipeline Blocked",
                "facts": [
                  { "name": "Branch", "value": "'"${{ github.ref_name }}"'" },
                  { "name": "Run",    "value": "#'"${{ github.run_number }}"'" },
                  { "name": "Action", "value": "Fix build errors and repush to wip branch" }
                ]
              }],
              "potentialAction": [{
                "@type": "OpenUri",
                "name": "View Failed Run",
                "targets": [{ "os": "default", "uri": "'"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"'" }]
              }]
            }'

      # ── 8. Lint ──────────────────────────────────────────────
      - name: Lint (format check)
        run: dotnet format DemoApp.sln --verify-no-changes || echo "⚠️ Lint issues found"

      # ── 9. Unit Tests ────────────────────────────────────────
      - name: Unit Tests
        id: tests
        run: dotnet test DemoApp.sln --verbosity normal

      - name: "Notify Teams — Unit Tests Failed"
        if: failure() && steps.tests.outcome == 'failure'
        run: |
          curl -s -X POST "${{ secrets.TEAMS_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{
              "@type": "MessageCard",
              "@context": "http://schema.org/extensions",
              "themeColor": "D13438",
              "summary": "Unit Tests Failed",
              "sections": [{
                "activityTitle": "❌ Unit Tests Failed — Pipeline Blocked",
                "facts": [
                  { "name": "Branch", "value": "'"${{ github.ref_name }}"'" },
                  { "name": "Run",    "value": "#'"${{ github.run_number }}"'" },
                  { "name": "Action", "value": "Fix failing tests and repush to wip branch" }
                ]
              }],
              "potentialAction": [{
                "@type": "OpenUri",
                "name": "View Failed Run",
                "targets": [{ "os": "default", "uri": "'"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"'" }]
              }]
            }'

      # ── 10. Integration Tests (stub) ─────────────────────────
      - name: Integration Tests
        run: echo "ℹ️ Skipping integration tests — replace with real tests later"

      # ── 11. Publish ───────────────────────────────────────────
      - name: Publish
        run: dotnet publish DemoApp/DemoApp.csproj -c Release -o out

      # ── 12. SonarQube (optional) ──────────────────────────────
      # - name: Sonar Scan
      #   uses: SonarSource/sonarqube-scan-action@v6
      #   env:
      #     SONAR_TOKEN:    ${{ secrets.SONAR_TOKEN }}
      #     SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      # ── 13. Docker Build ──────────────────────────────────────
      - name: Build Docker
        run: |
          docker build -t demo-dotnet:${{ github.run_number }} .
          docker tag demo-dotnet:${{ github.run_number }} demo-dotnet:latest

      # ── 14. Trivy Image Scan ──────────────────────────────────
      #  ✅ FIXED: was ${{ env.BUILD_ID }} (always empty in with: blocks)
      #            now uses ${{ github.run_number }} directly
      - name: Run Trivy Image Scan
        id: trivy_image
        uses: aquasecurity/trivy-action@v0.20.0
        with:
          image-ref:      demo-dotnet:${{ github.run_number }}
          exit-code:      1
          severity:       CRITICAL
          ignore-unfixed: true

      - name: "Notify Teams — Docker Image Scan Failed"
        if: failure() && steps.trivy_image.outcome == 'failure'
        run: |
          curl -s -X POST "${{ secrets.TEAMS_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{
              "@type": "MessageCard",
              "@context": "http://schema.org/extensions",
              "themeColor": "D13438",
              "summary": "Docker Image Scan Failed",
              "sections": [{
                "activityTitle": "❌ Docker Image Scan Failed — Pipeline Blocked",
                "activitySubtitle": "Trivy found fixable CRITICAL CVEs in the Docker image",
                "facts": [
                  { "name": "Image",   "value": "demo-dotnet:'"${{ github.run_number }}"'" },
                  { "name": "Branch",  "value": "'"${{ github.ref_name }}"'" },
                  { "name": "Run",     "value": "#'"${{ github.run_number }}"'" },
                  { "name": "Action",  "value": "Update base image or vulnerable packages and repush" }
                ]
              }],
              "potentialAction": [{
                "@type": "OpenUri",
                "name": "View Failed Run",
                "targets": [{ "os": "default", "uri": "'"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"'" }]
              }]
            }'

      # ── 15. ACR Push (stub) ───────────────────────────────────
      - name: Docker image push to ACR (Demo)
        run: |
          echo "🚀 Pushing demo-dotnet:${{ github.run_number }} to ACR (simulated)"
          # Uncomment to enable real push:
          # az acr login --name ${{ secrets.ACR_LOGIN_SERVER }}
          # docker push ${{ secrets.ACR_LOGIN_SERVER }}/demo-dotnet:${{ github.run_number }}

      # ── 16. Merge Conflict Check ──────────────────────────────
      - name: Check merge conflict
        id: conflict
        run: |
          SOURCE="${{ steps.vars.outputs.source }}"
          TARGET="${{ steps.vars.outputs.target }}"

          git checkout "$SOURCE"
          git merge "origin/$TARGET" --no-commit --no-ff \
            || echo "MERGE_FAILED=true" >> $GITHUB_ENV

          git merge --abort || true

          if [ "$MERGE_FAILED" = "true" ]; then

            curl -s -X POST "${{ secrets.TEAMS_WEBHOOK_URL }}" \
              -H "Content-Type: application/json" \
              -d '{
                "@type": "MessageCard",
                "@context": "http://schema.org/extensions",
                "themeColor": "D13438",
                "summary": "Merge Conflict Detected",
                "sections": [{
                  "activityTitle": "❌ Merge Conflict Detected — PR Blocked",
                  "activitySubtitle": "Manual resolution required before PR can be created",
                  "facts": [
                    { "name": "WIP Branch",         "value": "'"$SOURCE"'" },
                    { "name": "Consolidate Branch",  "value": "'"$TARGET"'" },
                    { "name": "App",                "value": "'"${{ steps.vars.outputs.app }}"'" },
                    { "name": "Sprint",             "value": "'"${{ steps.vars.outputs.sprint }}"'" },
                    { "name": "Team",               "value": "'"${{ steps.vars.outputs.team }}"'" },
                    { "name": "Fix",                "value": "git fetch origin && git merge origin/'"$TARGET"' — resolve conflicts — git push" }
                  ]
                }],
                "potentialAction": [{
                  "@type": "OpenUri",
                  "name": "View Run",
                  "targets": [{ "os": "default", "uri": "'"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"'" }]
                }]
              }'

            echo "❌ Merge conflict detected with $TARGET"
            exit 1
          fi
          echo "✅ No conflicts"

      # ── 17. Create Pull Request ───────────────────────────────
      - name: Create Pull Request
        id: pr
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          SOURCE="${{ steps.vars.outputs.source }}"
          TARGET="${{ steps.vars.outputs.target }}"

          EXISTING=$(gh pr list \
            --base "$TARGET" --head "$SOURCE" \
            --state open --json number,url --jq '.[0]')

          EXISTING_NUM=$(echo "$EXISTING" | jq -r '.number // empty')
          EXISTING_URL=$(echo "$EXISTING" | jq -r '.url // empty')

          if [ -z "$EXISTING_NUM" ]; then
            gh pr create \
              --base  "$TARGET" \
              --head  "$SOURCE" \
              --title "Auto PR: $SOURCE → $TARGET" \
              --body  "$(printf '🚀 Auto-created PR\n\n**App:** ${{ steps.vars.outputs.app }}\n**Sprint:** ${{ steps.vars.outputs.sprint }}\n**Team:** ${{ steps.vars.outputs.team }}')"

            PR_URL=$(gh pr list \
              --base "$TARGET" --head "$SOURCE" \
              --state open --json url --jq '.[0].url')

            echo "pr_status=created" >> $GITHUB_OUTPUT
            echo "pr_url=${PR_URL}"  >> $GITHUB_OUTPUT
            echo "✅ PR created: $PR_URL"
          else
            echo "pr_status=existing"     >> $GITHUB_OUTPUT
            echo "pr_url=${EXISTING_URL}" >> $GITHUB_OUTPUT
            echo "✅ PR #$EXISTING_NUM already exists"
          fi

      # ── 🔔 NOTIFY: PR Created ────────────────────────────────
      - name: "Notify Teams — PR Auto-Created"
        if: success() && steps.pr.outputs.pr_status == 'created'
        run: |
          curl -s -X POST "${{ secrets.TEAMS_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{
              "@type": "MessageCard",
              "@context": "http://schema.org/extensions",
              "themeColor": "107C10",
              "summary": "Pull Request Auto-Created",
              "sections": [{
                "activityTitle": "🔀 Pull Request Auto-Created",
                "activitySubtitle": "'"${{ steps.vars.outputs.source }}"' → '"${{ steps.vars.outputs.target }}"'",
                "facts": [
                  { "name": "PR URL",    "value": "'"${{ steps.pr.outputs.pr_url }}"'" },
                  { "name": "App",       "value": "'"${{ steps.vars.outputs.app }}"'" },
                  { "name": "Sprint",    "value": "'"${{ steps.vars.outputs.sprint }}"'" },
                  { "name": "Team",      "value": "'"${{ steps.vars.outputs.team }}"'" },
                  { "name": "Run",       "value": "#'"${{ github.run_number }}"'" }
                ]
              }],
              "potentialAction": [{
                "@type": "OpenUri",
                "name": "Review PR",
                "targets": [{ "os": "default", "uri": "'"${{ steps.pr.outputs.pr_url }}"'" }]
              }]
            }'

      # ── 🔔 NOTIFY: PR Already Exists (Updated) ───────────────
      - name: "Notify Teams — PR Updated"
        if: success() && steps.pr.outputs.pr_status == 'existing'
        run: |
          curl -s -X POST "${{ secrets.TEAMS_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{
              "@type": "MessageCard",
              "@context": "http://schema.org/extensions",
              "themeColor": "0078D4",
              "summary": "PR Updated by New Push",
              "sections": [{
                "activityTitle": "🔄 Existing PR Updated by New Push",
                "activitySubtitle": "'"${{ steps.vars.outputs.source }}"' → '"${{ steps.vars.outputs.target }}"'",
                "facts": [
                  { "name": "PR URL",   "value": "'"${{ steps.pr.outputs.pr_url }}"'" },
                  { "name": "App",      "value": "'"${{ steps.vars.outputs.app }}"'" },
                  { "name": "Sprint",   "value": "'"${{ steps.vars.outputs.sprint }}"'" },
                  { "name": "Team",     "value": "'"${{ steps.vars.outputs.team }}"'" },
                  { "name": "Pushed by","value": "'"${{ github.actor }}"'" }
                ]
              }],
              "potentialAction": [{
                "@type": "OpenUri",
                "name": "View PR",
                "targets": [{ "os": "default", "uri": "'"${{ steps.pr.outputs.pr_url }}"'" }]
              }]
            }'

      # ── 🔔 NOTIFY: Pipeline Success ──────────────────────────
      - name: "Notify Teams — Pipeline Success"
        if: success()
        run: |
          if [ "${{ steps.check.outputs.exists }}" == "false" ]; then
            RESULT="New consolidate branch created from main. Push again to trigger PR."
          else
            RESULT="All checks passed. PR created or already open."
          fi

          curl -s -X POST "${{ secrets.TEAMS_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{
              "@type": "MessageCard",
              "@context": "http://schema.org/extensions",
              "themeColor": "107C10",
              "summary": "WIP Build CI Passed",
              "sections": [{
                "activityTitle": "✅ WIP Build CI Completed Successfully",
                "facts": [
                  { "name": "WIP Branch",         "value": "'"${{ steps.vars.outputs.source }}"'" },
                  { "name": "Consolidate Branch",  "value": "'"${{ steps.vars.outputs.target }}"'" },
                  { "name": "App",                "value": "'"${{ steps.vars.outputs.app }}"'" },
                  { "name": "Sprint",             "value": "'"${{ steps.vars.outputs.sprint }}"'" },
                  { "name": "Team",               "value": "'"${{ steps.vars.outputs.team }}"'" },
                  { "name": "Image",              "value": "demo-dotnet:'"${{ github.run_number }}"'" },
                  { "name": "Run",                "value": "#'"${{ github.run_number }}"'" },
                  { "name": "Result",             "value": "'"$RESULT"'" }
                ]
              }],
              "potentialAction": [{
                "@type": "OpenUri",
                "name": "View Run",
                "targets": [{ "os": "default", "uri": "'"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"'" }]
              }]
            }'

      # ── 🔔 NOTIFY: Pipeline Failed (catch-all) ───────────────
      - name: "Notify Teams — Pipeline Failed"
        if: failure()
        run: |
          curl -s -X POST "${{ secrets.TEAMS_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{
              "@type": "MessageCard",
              "@context": "http://schema.org/extensions",
              "themeColor": "D13438",
              "summary": "WIP Build CI Failed",
              "sections": [{
                "activityTitle": "❌ WIP Build CI Failed",
                "facts": [
                  { "name": "Branch",      "value": "'"${{ github.ref_name }}"'" },
                  { "name": "Triggered by","value": "'"${{ github.actor }}"'" },
                  { "name": "Run",         "value": "#'"${{ github.run_number }}"'" }
                ]
              }],
              "potentialAction": [{
                "@type": "OpenUri",
                "name": "View Failed Run",
                "targets": [{ "os": "default", "uri": "'"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"'" }]
              }]
            }'

      # ── 18. Summary ───────────────────────────────────────────
      - name: Summary
        if: always()
        run: |
          echo "================================================"
          echo "  WIP Build CI"
          echo "  Source : ${{ steps.vars.outputs.source }}"
          echo "  Target : ${{ steps.vars.outputs.target }}"
          echo "  Image  : demo-dotnet:${{ github.run_number }}"
          echo "  Run    : #${{ github.run_number }}"
          echo "================================================"