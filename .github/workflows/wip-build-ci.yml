name: WIP Build CI

on:
  push:
    branches:
      - wip/*

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ✅ Checkout code
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure Git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      # ✅ Extract app + sprint + team
      - name: Extract branch info
        id: vars
        run: |
          SOURCE_BRANCH="${GITHUB_REF#refs/heads/}"
          echo "Processing: $SOURCE_BRANCH"

          # Validate format
          if [[ ! "$SOURCE_BRANCH" =~ ^wip\/[a-zA-Z0-9]+-[0-9]+-team[0-9]+$ ]]; then
            echo "Invalid branch format. Expected: wip/<app>-<sprint>-team<no>"
            exit 1
          fi

          APP=$(echo "$SOURCE_BRANCH" | cut -d'/' -f2 | cut -d'-' -f1)
          SPRINT=$(echo "$SOURCE_BRANCH" | cut -d'-' -f2)
          TEAM=$(echo "$SOURCE_BRANCH" | cut -d'-' -f3)

          
          TARGET_BRANCH="consolidate/${APP}-${TEAM}-${SPRINT}"

          echo "source=$SOURCE_BRANCH" >> $GITHUB_OUTPUT
          echo "target=$TARGET_BRANCH" >> $GITHUB_OUTPUT
          echo "app=$APP" >> $GITHUB_OUTPUT
          echo "sprint=$SPRINT" >> $GITHUB_OUTPUT
          echo "team=$TEAM" >> $GITHUB_OUTPUT

          echo "Target Branch: $TARGET_BRANCH"

      # ✅ Check if consolidate branch exists
      - name: Check if consolidate branch exists
        id: check
        run: |
          git fetch origin

          if git ls-remote --exit-code --heads origin "${{ steps.vars.outputs.target }}"; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Consolidate branch exists"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Consolidate branch will be created"
          fi

      # ✅ Create consolidate branch ONLY if missing
      - name: Create consolidate branch
        if: steps.check.outputs.exists == 'false'
        run: |
          TARGET="${{ steps.vars.outputs.target }}"

          echo "Creating $TARGET from main"
          git checkout origin/main -b "$TARGET"
          git push origin "$TARGET"

      # ✅ Fetch target branch (ensure available)
      - name: Fetch target branch
        if: steps.check.outputs.exists == 'true'
        run: |
          git fetch origin "${{ steps.vars.outputs.target }}"

      
      # ── 2. Credential Scan (Gitleaks) ───────────────────────
      - name: Credential Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


      # ──  Setup .NET ────────────────────────────────────────
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # ── 5. Restore ───────────────────────────────────────────
      - name: Restore
        run: dotnet restore DemoApp.sln

      # ── 6. Build  ────────────────────────────────────────────
      #    Must come BEFORE lint and test so binaries exist
      - name: Build
        run: dotnet build DemoApp.sln --no-restore

      # ── 7. Lint (format check) ───────────────────────────────
      #    Runs after build so all generated files are present
      - name: Lint (format check)
        run: dotnet format DemoApp.sln --verify-no-changes || echo "⚠️ Lint issues found"

      # ── 8. Unit Tests ─────────────────────────────────────────
      #    --no-build is safe here because step 6 already built
      - name: Unit Tests
        run: dotnet test DemoApp.sln --verbosity normal

      # ── 9. Integration Tests (stub) ──────────────────────────
      - name: Integration Tests
        run: echo "ℹ️ Skipping integration tests — replace with real tests later"

      # ── 10. Publish ───────────────────────────────────────────
      - name: Publish
        run: dotnet publish DemoApp/DemoApp.csproj -c Release -o out

      # ── 11. Static Code Analysis (SonarQube — optional) ──────
      # Uncomment when SONAR_TOKEN and SONAR_HOST_URL are set
      # - name: Sonar Scan
      #   uses: SonarSource/sonarqube-scan-action@v6
      #   env:
      #     SONAR_TOKEN:    ${{ secrets.SONAR_TOKEN }}
      #     SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      # ── 12. Docker Build ──────────────────────────────────────
      - name: Build Docker
        run: |
          docker build -t demo-dotnet:${{ github.run_number }} .
          docker tag demo-dotnet:${{ github.run_number }} demo-dotnet:latest



      # 🔐 Trivy Image Scan (using build id)
      - name: Run Trivy Image Scan
        uses: aquasecurity/trivy-action@v0.20.0
        with:
          image-ref: demo-ci-app:${{ env.BUILD_ID }}
          exit-code: 1
          severity: CRITICAL
          ignore-unfixed: true

      # 🚀 Docker Image Push to ACR (Optional)
            # 🚀 Docker Image Push to ACR (Demo Only)
      - name: Docker image push to ACR (Demo)
        run: |
          echo "Logging into ACR: image push to acr"
      #    echo "Tagging image: demo-ci-app:${{ env.BUILD_ID }}"
      #    echo "Target: ${{ secrets.ACR_LOGIN_SERVER }}/demo-ci-app:${{ env.BUILD_ID }}"
      #    echo "🚀 Docker image pushed to Azure Container Registry successfully (simulated)"
      # ✅ Conflict check ONLY if branch exists
      - name: Check merge conflict
#     # if: steps.check.outputs.exists == 'true'
        run: |
          SOURCE=${{ steps.vars.outputs.source }}
          TARGET=${{ steps.vars.outputs.target }}

          git checkout $SOURCE

          git merge origin/$TARGET --no-commit --no-ff || echo "MERGE_FAILED=true" >> $GITHUB_ENV

          if [ "$MERGE_FAILED" = "true" ]; then
            echo "❌ Merge conflict detected with $TARGET"
            exit 1
          else
            echo "✅ No conflicts"
          fi

          git merge --abort || true

      # ✅ Create PR ONLY if branch already existed
      - name: Create Pull Request
#     # if: steps.check.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          SOURCE=${{ steps.vars.outputs.source }}
          TARGET=${{ steps.vars.outputs.target }}

          echo "Creating PR: $SOURCE → $TARGET"

          EXISTING=$(gh pr list --base "$TARGET" --head "$SOURCE" --state open --json number --jq '.[0].number')

          if [ -z "$EXISTING" ]; then
            gh pr create \
              --base "$TARGET" \
              --head "$SOURCE" \
              --title "Auto PR: $SOURCE → $TARGET" \
              --body "🚀 Auto-created PR\n\nApp: ${{ steps.vars.outputs.app }}\nSprint: ${{ steps.vars.outputs.sprint }}\nTeam: ${{ steps.vars.outputs.team }}"
          else
            echo "✅ PR #$EXISTING already exists. Skipping."
          fi

      # ✅ Final summary
      - name: Summary
        run: |
          if [ "${{ steps.check.outputs.exists }}" == "false" ]; then
            echo "✔ WIP branch created. No PR needed."
          else
            echo "✔ WIP branch existed. PR handled."
          fi