# ============================================================
#  Feature → WIP + Conditional PR Pipeline
#  + Microsoft Teams Notifications (Incoming Webhook)
#
#  SETUP — Add this secret to your repository:
#    Name : TEAMS_WEBHOOK_URL
#    Value: your Teams Incoming Webhook URL
#
#  HOW TO GET THE WEBHOOK URL:
#    1. Open Microsoft Teams
#    2. Go to the channel you want notifications in
#    3. Click ··· → Connectors (or Workflows in newer Teams)
#    4. Add "Incoming Webhook" → give it a name → Copy URL
#    5. Paste URL into GitHub repo secret: TEAMS_WEBHOOK_URL
#
#  NOTIFICATIONS SENT:
#    🚀 Pipeline Started
#    ✅ WIP Branch Created
#    🔀 PR Auto-Created
#    ❌ Merge Conflict Detected
#    ❌ Invalid Branch Name
#    ✅ Pipeline Success Summary
#    ❌ Pipeline Failed (on any unexpected error)
# ============================================================

name: Feature → WIP + Conditional PR

on:
  push:
    branches:
      - 'feature/*'

permissions:
  contents: write
  pull-requests: write

jobs:
  manage-wip:
    runs-on: ubuntu-latest

    steps:

      # ── 1. Checkout ─────────────────────────────────────────
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name  "github-actions"
          git config user.email "github-actions@github.com"

      # ── 🔔 NOTIFY: Pipeline Started ─────────────────────────
      - name: "Notify Teams — Pipeline Started"
        run: |
          curl -s -X POST "${{ secrets.TEAMS_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{
              "@type": "MessageCard",
              "@context": "http://schema.org/extensions",
              "themeColor": "0078D4",
              "summary": "Pipeline Started",
              "sections": [{
                "activityTitle": "🚀 Pipeline Started",
                "activitySubtitle": "Feature → WIP + Conditional PR",
                "facts": [
                  { "name": "Branch",     "value": "'"${{ github.ref_name }}"'" },
                  { "name": "Triggered by","value": "'"${{ github.actor }}"'" },
                  { "name": "Run",        "value": "#'"${{ github.run_number }}"'" },
                  { "name": "Repository", "value": "'"${{ github.repository }}"'" }
                ]
              }],
              "potentialAction": [{
                "@type": "OpenUri",
                "name": "View Run",
                "targets": [{ "os": "default", "uri": "'"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"'" }]
              }]
            }'

      # ── 2. Extract & Validate Branch Info ───────────────────
      - name: Extract branch info
        id: vars
        run: |
          SOURCE_BRANCH="${GITHUB_REF#refs/heads/}"
          echo "Processing: $SOURCE_BRANCH"

          if [[ ! "$SOURCE_BRANCH" =~ ^feature\/([a-zA-Z0-9]+)-([a-zA-Z0-9]+)-([0-9]+)-(team[0-9a-zA-Z]+)$ ]]; then

            # ── 🔔 NOTIFY: Invalid Branch Name ──────────────
            curl -s -X POST "${{ secrets.TEAMS_WEBHOOK_URL }}" \
              -H "Content-Type: application/json" \
              -d '{
                "@type": "MessageCard",
                "@context": "http://schema.org/extensions",
                "themeColor": "D13438",
                "summary": "Invalid Branch Name",
                "sections": [{
                  "activityTitle": "❌ Invalid Branch Name — Pipeline Stopped",
                  "activitySubtitle": "Branch does not match required naming convention",
                  "facts": [
                    { "name": "Branch",   "value": "'"$SOURCE_BRANCH"'" },
                    { "name": "Expected", "value": "feature/<app>-<type>-<sprint>-<team>" },
                    { "name": "Example",  "value": "feature/api-cd-8746-team1" },
                    { "name": "Run",      "value": "#'"${{ github.run_number }}"'" }
                  ]
                }],
                "potentialAction": [{
                  "@type": "OpenUri",
                  "name": "View Run",
                  "targets": [{ "os": "default", "uri": "'"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"'" }]
                }]
              }'

            echo "❌ Invalid branch format. Expected: feature/<app>-<type>-<sprint>-<team>"
            exit 1
          fi

          APP=$(echo "$SOURCE_BRANCH"    | cut -d'/' -f2 | cut -d'-' -f1)
          SPRINT=$(echo "$SOURCE_BRANCH" | cut -d'-' -f3)
          TEAM=$(echo "$SOURCE_BRANCH"   | cut -d'-' -f4)
          TARGET_BRANCH="wip/${APP}-${SPRINT}-${TEAM}"

          echo "source=$SOURCE_BRANCH"  >> $GITHUB_OUTPUT
          echo "target=$TARGET_BRANCH"  >> $GITHUB_OUTPUT
          echo "app=$APP"               >> $GITHUB_OUTPUT
          echo "sprint=$SPRINT"         >> $GITHUB_OUTPUT
          echo "team=$TEAM"             >> $GITHUB_OUTPUT

          echo "✅ APP=$APP | SPRINT=$SPRINT | TEAM=$TEAM | TARGET=$TARGET_BRANCH"

      # ── 3. Check if WIP Branch Exists ───────────────────────
      - name: Check if WIP branch exists
        id: check
        run: |
          git fetch origin
          if git ls-remote --exit-code --heads origin "${{ steps.vars.outputs.target }}"; then
            echo "exists=true"  >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      # ── 4a. Create WIP Branch (only if missing) ─────────────
      - name: Create WIP branch
        if: steps.check.outputs.exists == 'false'
        run: |
          TARGET="${{ steps.vars.outputs.target }}"
          git checkout origin/main -b "$TARGET"
          git push origin "$TARGET"
          echo "✅ Created: $TARGET"

      # ── 🔔 NOTIFY: WIP Branch Created ───────────────────────
      - name: "Notify Teams — WIP Branch Created"
        if: steps.check.outputs.exists == 'false'
        run: |
          curl -s -X POST "${{ secrets.TEAMS_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{
              "@type": "MessageCard",
              "@context": "http://schema.org/extensions",
              "themeColor": "107C10",
              "summary": "WIP Branch Created",
              "sections": [{
                "activityTitle": "✅ WIP Branch Created",
                "activitySubtitle": "A new WIP branch has been created from main",
                "facts": [
                  { "name": "WIP Branch",     "value": "'"${{ steps.vars.outputs.target }}"'" },
                  { "name": "Source Branch",  "value": "'"${{ steps.vars.outputs.source }}"'" },
                  { "name": "App",            "value": "'"${{ steps.vars.outputs.app }}"'" },
                  { "name": "Sprint",         "value": "'"${{ steps.vars.outputs.sprint }}"'" },
                  { "name": "Team",           "value": "'"${{ steps.vars.outputs.team }}"'" },
                  { "name": "Created by",     "value": "'"${{ github.actor }}"'" },
                  { "name": "Note",           "value": "Push again to this branch to trigger a PR" }
                ]
              }],
              "potentialAction": [{
                "@type": "OpenUri",
                "name": "View Run",
                "targets": [{ "os": "default", "uri": "'"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"'" }]
              }]
            }'

      # ── 4b. Fetch WIP Branch (only if it existed) ───────────
      - name: Fetch WIP branch
        if: steps.check.outputs.exists == 'true'
        run: |
          git fetch origin "${{ steps.vars.outputs.target }}"

      # ── 5. Conflict Check ────────────────────────────────────
      - name: Check merge conflict
        if: steps.check.outputs.exists == 'true'
        run: |
          SOURCE="${{ steps.vars.outputs.source }}"
          TARGET="${{ steps.vars.outputs.target }}"

          git checkout "$SOURCE"
          git merge "origin/$TARGET" --no-commit --no-ff \
            || echo "MERGE_FAILED=true" >> $GITHUB_ENV

          git merge --abort || true

          if [ "$MERGE_FAILED" = "true" ]; then

            # ── 🔔 NOTIFY: Merge Conflict ───────────────────
            curl -s -X POST "${{ secrets.TEAMS_WEBHOOK_URL }}" \
              -H "Content-Type: application/json" \
              -d '{
                "@type": "MessageCard",
                "@context": "http://schema.org/extensions",
                "themeColor": "D13438",
                "summary": "Merge Conflict Detected",
                "sections": [{
                  "activityTitle": "❌ Merge Conflict Detected — PR Blocked",
                  "activitySubtitle": "Manual resolution required before PR can be created",
                  "facts": [
                    { "name": "Feature Branch", "value": "'"$SOURCE"'" },
                    { "name": "WIP Branch",     "value": "'"$TARGET"'" },
                    { "name": "App",            "value": "'"${{ steps.vars.outputs.app }}"'" },
                    { "name": "Sprint",         "value": "'"${{ steps.vars.outputs.sprint }}"'" },
                    { "name": "Team",           "value": "'"${{ steps.vars.outputs.team }}"'" },
                    { "name": "Triggered by",   "value": "'"${{ github.actor }}"'" },
                    { "name": "Fix",            "value": "Run: git fetch origin && git merge origin/'"$TARGET"' — resolve conflicts — git push" }
                  ]
                }],
                "potentialAction": [{
                  "@type": "OpenUri",
                  "name": "View Run",
                  "targets": [{ "os": "default", "uri": "'"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"'" }]
                }]
              }'

            echo "❌ Merge conflict: $SOURCE → $TARGET"
            exit 1
          fi
          echo "✅ No conflicts"

      # ── 6. Create Pull Request ───────────────────────────────
      - name: Create Pull Request
        id: pr
        if: steps.check.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          SOURCE="${{ steps.vars.outputs.source }}"
          TARGET="${{ steps.vars.outputs.target }}"

          EXISTING=$(gh pr list \
            --base "$TARGET" --head "$SOURCE" \
            --state open --json number,url \
            --jq '.[0]')

          EXISTING_NUM=$(echo "$EXISTING" | jq -r '.number // empty')
          EXISTING_URL=$(echo "$EXISTING" | jq -r '.url // empty')

          if [ -z "$EXISTING_NUM" ]; then
            PR_URL=$(gh pr create \
              --base  "$TARGET" \
              --head  "$SOURCE" \
              --title "Auto PR: $SOURCE → $TARGET" \
              --body  "$(printf '🚀 Auto-created PR\n\n**App:** ${{ steps.vars.outputs.app }}\n**Sprint:** ${{ steps.vars.outputs.sprint }}\n**Team:** ${{ steps.vars.outputs.team }}')" \
              --json url --jq '.url' 2>/dev/null || \
              gh pr view --head "$SOURCE" --base "$TARGET" --json url --jq '.url')

            echo "pr_status=created"    >> $GITHUB_OUTPUT
            echo "pr_url=${PR_URL}"     >> $GITHUB_OUTPUT
            echo "pr_number=new"        >> $GITHUB_OUTPUT
            echo "✅ PR created: $PR_URL"
          else
            echo "pr_status=existing"        >> $GITHUB_OUTPUT
            echo "pr_url=${EXISTING_URL}"    >> $GITHUB_OUTPUT
            echo "pr_number=${EXISTING_NUM}" >> $GITHUB_OUTPUT
            echo "✅ PR #$EXISTING_NUM already exists"
          fi

      # ── 🔔 NOTIFY: PR Created ────────────────────────────────
      - name: "Notify Teams — PR Auto-Created"
        if: steps.check.outputs.exists == 'true' && steps.pr.outputs.pr_status == 'created'
        run: |
          curl -s -X POST "${{ secrets.TEAMS_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{
              "@type": "MessageCard",
              "@context": "http://schema.org/extensions",
              "themeColor": "107C10",
              "summary": "Pull Request Auto-Created",
              "sections": [{
                "activityTitle": "🔀 Pull Request Auto-Created",
                "activitySubtitle": "'"${{ steps.vars.outputs.source }}"' → '"${{ steps.vars.outputs.target }}"'",
                "facts": [
                  { "name": "PR URL",        "value": "'"${{ steps.pr.outputs.pr_url }}"'" },
                  { "name": "App",           "value": "'"${{ steps.vars.outputs.app }}"'" },
                  { "name": "Sprint",        "value": "'"${{ steps.vars.outputs.sprint }}"'" },
                  { "name": "Team",          "value": "'"${{ steps.vars.outputs.team }}"'" },
                  { "name": "Created by",    "value": "'"${{ github.actor }}"'" },
                  { "name": "Action needed", "value": "Review and approve the PR" }
                ]
              }],
              "potentialAction": [{
                "@type": "OpenUri",
                "name": "Review PR",
                "targets": [{ "os": "default", "uri": "'"${{ steps.pr.outputs.pr_url }}"'" }]
              }]
            }'

      # ── 🔔 NOTIFY: PR Already Exists ────────────────────────
      - name: "Notify Teams — PR Updated (existing PR)"
        if: steps.check.outputs.exists == 'true' && steps.pr.outputs.pr_status == 'existing'
        run: |
          curl -s -X POST "${{ secrets.TEAMS_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{
              "@type": "MessageCard",
              "@context": "http://schema.org/extensions",
              "themeColor": "0078D4",
              "summary": "PR Updated",
              "sections": [{
                "activityTitle": "🔄 Existing PR Updated by New Push",
                "activitySubtitle": "'"${{ steps.vars.outputs.source }}"' → '"${{ steps.vars.outputs.target }}"'",
                "facts": [
                  { "name": "PR",         "value": "#'"${{ steps.pr.outputs.pr_number }}"'" },
                  { "name": "PR URL",     "value": "'"${{ steps.pr.outputs.pr_url }}"'" },
                  { "name": "App",        "value": "'"${{ steps.vars.outputs.app }}"'" },
                  { "name": "Sprint",     "value": "'"${{ steps.vars.outputs.sprint }}"'" },
                  { "name": "Team",       "value": "'"${{ steps.vars.outputs.team }}"'" },
                  { "name": "Pushed by",  "value": "'"${{ github.actor }}"'" }
                ]
              }],
              "potentialAction": [{
                "@type": "OpenUri",
                "name": "View PR",
                "targets": [{ "os": "default", "uri": "'"${{ steps.pr.outputs.pr_url }}"'" }]
              }]
            }'

      # ── 🔔 NOTIFY: Pipeline Success Summary ─────────────────
      - name: "Notify Teams — Pipeline Success"
        if: success()
        run: |
          if [ "${{ steps.check.outputs.exists }}" == "false" ]; then
            RESULT="New WIP branch created from main. Push again to trigger PR."
          else
            RESULT="Conflict check passed. PR created or already open."
          fi

          curl -s -X POST "${{ secrets.TEAMS_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{
              "@type": "MessageCard",
              "@context": "http://schema.org/extensions",
              "themeColor": "107C10",
              "summary": "Pipeline Completed Successfully",
              "sections": [{
                "activityTitle": "✅ Pipeline Completed Successfully",
                "activitySubtitle": "Feature → WIP + Conditional PR",
                "facts": [
                  { "name": "Source Branch", "value": "'"${{ steps.vars.outputs.source }}"'" },
                  { "name": "Target Branch", "value": "'"${{ steps.vars.outputs.target }}"'" },
                  { "name": "App",           "value": "'"${{ steps.vars.outputs.app }}"'" },
                  { "name": "Sprint",        "value": "'"${{ steps.vars.outputs.sprint }}"'" },
                  { "name": "Team",          "value": "'"${{ steps.vars.outputs.team }}"'" },
                  { "name": "Run",           "value": "#'"${{ github.run_number }}"'" },
                  { "name": "Result",        "value": "'"$RESULT"'" }
                ]
              }],
              "potentialAction": [{
                "@type": "OpenUri",
                "name": "View Run",
                "targets": [{ "os": "default", "uri": "'"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"'" }]
              }]
            }'

      # ── 🔔 NOTIFY: Pipeline Failed ───────────────────────────
      - name: "Notify Teams — Pipeline Failed"
        if: failure()
        run: |
          curl -s -X POST "${{ secrets.TEAMS_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{
              "@type": "MessageCard",
              "@context": "http://schema.org/extensions",
              "themeColor": "D13438",
              "summary": "Pipeline Failed",
              "sections": [{
                "activityTitle": "❌ Pipeline Failed",
                "activitySubtitle": "Feature → WIP + Conditional PR",
                "facts": [
                  { "name": "Branch",      "value": "'"${{ github.ref_name }}"'" },
                  { "name": "Triggered by","value": "'"${{ github.actor }}"'" },
                  { "name": "Run",         "value": "#'"${{ github.run_number }}"'" },
                  { "name": "Repository",  "value": "'"${{ github.repository }}"'" }
                ]
              }],
              "potentialAction": [{
                "@type": "OpenUri",
                "name": "View Failed Run",
                "targets": [{ "os": "default", "uri": "'"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"'" }]
              }]
            }'