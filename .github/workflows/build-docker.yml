# ============================================================
#  Full CI Pipeline (.NET + Security)
#  Fixed step order:
#    checkout → secrets scan → fs scan → setup → restore
#    → BUILD → lint → test → publish → docker → image scan
#
#  Bug fixed: original ran `dotnet test --no-build` BEFORE
#  `dotnet build` which always fails. Build must come first.
# ============================================================

name: Full CI Pipeline (.NET + Security)

on:
  push:
    branches:
      - mdain
      - 'widp/*'
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:

      # ── 1. Checkout ─────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history needed by Gitleaks

      # ── 2. Credential Scan (Gitleaks) ───────────────────────
      - name: Credential Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── 3. Filesystem Vulnerability Scan ────────────────────
      - name: Trivy FS Scan
        uses: aquasecurity/trivy-action@v0.20.0
        with:
          scan-type: fs
          scan-ref:  .
          severity:  HIGH,CRITICAL
          exit-code: 1

      # ── 4. Setup .NET ────────────────────────────────────────
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # ── 5. Restore ───────────────────────────────────────────
      - name: Restore
        run: dotnet restore DemoApp.sln

      # ── 6. Build  ────────────────────────────────────────────
      #    Must come BEFORE lint and test so binaries exist
      - name: Build
        run: dotnet build DemoApp.sln --no-restore

      # ── 7. Lint (format check) ───────────────────────────────
      #    Runs after build so all generated files are present
      - name: Lint (format check)
        run: dotnet format DemoApp.sln --verify-no-changes || echo "⚠️ Lint issues found"

      # ── 8. Unit Tests ─────────────────────────────────────────
      #    --no-build is safe here because step 6 already built
      - name: Unit Tests
        run: dotnet test DemoApp.sln --verbosity normal

      # ── 9. Integration Tests (stub) ──────────────────────────
      - name: Integration Tests
        run: echo "ℹ️ Skipping integration tests — replace with real tests later"

      # ── 10. Publish ───────────────────────────────────────────
      - name: Publish
        run: dotnet publish DemoApp/DemoApp.csproj -c Release -o out

      # ── 11. Static Code Analysis (SonarQube — optional) ──────
      # Uncomment when SONAR_TOKEN and SONAR_HOST_URL are set
      # - name: Sonar Scan
      #   uses: SonarSource/sonarqube-scan-action@v6
      #   env:
      #     SONAR_TOKEN:    ${{ secrets.SONAR_TOKEN }}
      #     SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      # ── 12. Docker Build ──────────────────────────────────────
      - name: Build Docker
        run: |
          docker build -t demo-dotnet:${{ github.run_number }} .
          docker tag demo-dotnet:${{ github.run_number }} demo-dotnet:latest

      # ── 13. Docker Image Scan ─────────────────────────────────
      - name: Trivy Image Scan
        uses: aquasecurity/trivy-action@v0.20.0
        with:
          image-ref:      demo-dotnet:${{ github.run_number }}
          severity:       HIGH,CRITICAL
          exit-code:      1
          ignore-unfixed: true   # skip CVEs with no fix available (e.g. OS-level libc)

      # ── 14. Summary ───────────────────────────────────────────
      - name: Pipeline Summary
        if: always()
        run: |
          echo "================================================"
          echo "  Full CI Pipeline Complete"
          echo "  Run    : #${{ github.run_number }}"
          echo "  Branch : ${{ github.ref_name }}"
          echo "  Commit : ${{ github.sha }}"
          echo "================================================"